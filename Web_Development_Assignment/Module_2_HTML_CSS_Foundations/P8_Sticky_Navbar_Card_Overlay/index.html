<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>P8: Sticky Navbar and Card Overlay</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

<nav class="navbar"><strong>My Website</strong><a href="#cards">Cards</a><a href="#about">About</a></nav>
<main>
    <section id="about"><h1>Welcome</h1><p>This page shows a sticky navigation bar and a text overlay on a card image.</p></section>
    <section id="cards" class="card">
        <img src="https://placehold.co/800x350/e5e5e5/333?text=My+Project" alt="Simple project placeholder">
        <div class="overlay"><h2>My Project</h2><p>A short description of the project.</p></div>
    </section>
    <p class="extra">Scroll down to see that the navigation bar stays at the top.</p>
</main>

    </body>
    </html>
