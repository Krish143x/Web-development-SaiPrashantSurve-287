<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P13: Flexbox vs Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Flexbox and Grid</h1>
        <p>Choosing a layout for the page</p>
    </header>
    <main>
        <section>
            <h2>Flexbox Example</h2>
            <p>Flexbox is useful for arranging items in one direction, such as a row or a column.</p>
            <div class="flex-example">
                <div>Home</div>
                <div>About</div>
                <div>Contact</div>
            </div>
        </section>
        <section>
            <h2>Grid Example</h2>
            <p>Grid is useful for arranging items in rows and columns together.</p>
            <div class="grid-example">
                <div>One</div>
                <div>Two</div>
                <div>Three</div>
                <div>Four</div>
            </div>
        </section>
    </main>
    <footer>
        <p>Simple layout demonstration</p>
    </footer>

</body>

</html>
